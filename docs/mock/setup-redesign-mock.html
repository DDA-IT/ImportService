<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mock: Inrichting (leveranciers, importdefinities)</title>
<style>
/* ===== Tokens (letterlijk uit Frontend/src/styles/tokens.css) ===== */
:root {
  color-scheme: light;
  --primary-lighter: #CAFDF5; --primary-light: #61F3F3; --primary-main: #00B8D9; --primary-dark: #006C9C; --primary-darker: #003768; --primary-contrast: #FFFFFF;
  --primary-ch: 0 184 217;
  --success-main: #22C55E; --success-dark: #118D57; --success-light: #77ED8B; --success-ch: 34 197 94;
  --warning-main: #FFAB00; --warning-dark: #B76E00; --warning-light: #FFD666; --warning-ch: 255 171 0;
  --error-main: #FF5630;   --error-dark: #B71D18;   --error-light: #FFAC82;   --error-ch: 255 86 48;
  --info-main: #00A76F;    --info-dark: #007867;    --info-light: #5BE49B;    --info-ch: 0 167 111;
  --secondary-main: #8E33FF; --secondary-dark: #5119B7; --secondary-light: #C684FF; --secondary-ch: 142 51 255;
  --grey-ch: 145 158 171;
  --black-ch: 0 0 0;
  --text-primary: #1C252E; --text-secondary: #637381; --text-disabled: #919EAB;
  --bg-default: #FFFFFF; --bg-paper: #FFFFFF; --bg-neutral: #F4F6F8;
  --bg-default-ch: 255 255 255; --bg-paper-ch: 255 255 255;
  --action-active: #637381;
  --action-hover: rgb(var(--grey-ch) / 0.08);
  --action-selected: rgb(var(--grey-ch) / 0.16);
  --divider: rgb(var(--grey-ch) / 0.2);
  --input-outlined: rgb(var(--grey-ch) / 0.2);
  --button-outlined: rgb(var(--grey-ch) / 0.32);
  --nav-border: rgb(var(--grey-ch) / 0.12);
  --inherit-bg: #1C252E; --inherit-text: #FFFFFF; --inherit-hover: #454F5B;
  --soft-default-bg: rgb(var(--grey-ch) / 0.16); --soft-default-text: #1C252E;
  --soft-primary-text: var(--primary-dark);
  --soft-success-text: var(--success-dark);
  --soft-warning-text: var(--warning-dark);
  --soft-error-text: var(--error-dark);
  --soft-info-text: var(--info-dark);
  --nav-active-color: var(--primary-main);
  --shadow-ch: var(--grey-ch);
  --shadow-card: 0 0 2px 0 rgb(var(--shadow-ch) / 0.2), 0 12px 24px -4px rgb(var(--shadow-ch) / 0.12);
  --shadow-dropdown: 0 0 2px 0 rgb(var(--shadow-ch) / 0.24), -20px 20px 40px -4px rgb(var(--shadow-ch) / 0.24);
  --shadow-dialog: -40px 40px 80px -8px rgb(var(--black-ch) / 0.24);
  --shadow-z8: 0 8px 16px 0 rgb(var(--shadow-ch) / 0.16);
  --shadow-primary: 0 8px 16px 0 rgb(var(--primary-ch) / 0.24);
  --backdrop: rgb(28 37 46 / 0.48);
  --focus-ring: rgb(var(--primary-ch) / 0.48);
  --radius: 8px; --radius-card: 16px; --radius-label: 6px; --radius-dropdown: 10px;
  --nav-w: 300px; --nav-mini-w: 88px; --nav-mobile-w: 288px;
  --header-h: 64px;
}
@media (min-width: 1200px) { :root { --header-h: 72px; } }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --text-primary: #FFFFFF; --text-secondary: #919EAB; --text-disabled: #637381;
    --bg-default: #141A21; --bg-paper: #1C252E; --bg-neutral: #28323D;
    --bg-default-ch: 20 26 33; --bg-paper-ch: 28 37 46;
    --action-active: #919EAB;
    --nav-border: rgb(var(--grey-ch) / 0.08);
    --inherit-bg: #FFFFFF; --inherit-text: #1C252E; --inherit-hover: #C4CDD5;
    --soft-default-text: #FFFFFF;
    --soft-primary-text: var(--primary-light); --soft-success-text: var(--success-light);
    --soft-warning-text: var(--warning-light); --soft-error-text: var(--error-light); --soft-info-text: var(--info-light);
    --nav-active-color: var(--primary-light);
    --shadow-ch: var(--black-ch);
    --backdrop: rgb(0 0 0 / 0.6);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --text-primary: #FFFFFF; --text-secondary: #919EAB; --text-disabled: #637381;
  --bg-default: #141A21; --bg-paper: #1C252E; --bg-neutral: #28323D;
  --bg-default-ch: 20 26 33; --bg-paper-ch: 28 37 46;
  --action-active: #919EAB;
  --nav-border: rgb(var(--grey-ch) / 0.08);
  --inherit-bg: #FFFFFF; --inherit-text: #1C252E; --inherit-hover: #C4CDD5;
  --soft-default-text: #FFFFFF;
  --soft-primary-text: var(--primary-light); --soft-success-text: var(--success-light);
  --soft-warning-text: var(--warning-light); --soft-error-text: var(--error-light); --soft-info-text: var(--info-light);
  --nav-active-color: var(--primary-light);
  --shadow-ch: var(--black-ch);
  --backdrop: rgb(0 0 0 / 0.6);
}
:root {
  --font-sans: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --color-accent: var(--primary-main);
  --color-border-dark: var(--button-outlined);
  --color-danger: var(--error-main); --color-warning: var(--warning-main); --color-success: var(--success-main);
  --status-ready-text: var(--soft-success-text); --status-ready-bg: rgb(var(--success-ch) / 0.16);
  --status-awaiting-text: var(--soft-warning-text); --status-awaiting-bg: rgb(var(--warning-ch) / 0.16);
  --status-planned-text: var(--soft-info-text); --status-planned-bg: rgb(var(--info-ch) / 0.16);
  --status-neutral-text: var(--soft-default-text); --status-neutral-bg: var(--soft-default-bg);
  --alert-info-bg: rgb(var(--primary-ch) / 0.12);
  --radius-sm: var(--radius-label);
}

/* ===== Basis ===== */
* { box-sizing: border-box; }
body { margin: 0; font-family: var(--font-sans); font-size: 14px; line-height: 1.57; color: var(--text-primary); background: var(--bg-default); }
button { font: inherit; color: inherit; }
a { color: var(--soft-primary-text); }
:focus-visible { outline: 2px solid var(--primary-main); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }

/* ===== Mock-schakelaar ===== */
.mockbar { position: sticky; top: 0; z-index: 1400; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 8px 16px; background: var(--inherit-bg); color: var(--inherit-text); font-size: 13px; }
.seg { display: inline-flex; border: 1px solid currentColor; border-radius: var(--radius-label); overflow: hidden; }
.seg button { padding: 4px 12px; border: 0; background: transparent; color: inherit; cursor: pointer; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--primary-main); color: #fff; font-weight: 600; }
.mockbar :focus-visible { outline-color: var(--primary-light); }

/* ===== Shell ===== */
.sidebar { position: fixed; top: 0; bottom: 0; left: 0; z-index: 1201; width: var(--nav-w); display: flex; flex-direction: column; background: var(--bg-default); border-right: 1px solid var(--nav-border); transition: transform 200ms ease; }
.navTop { padding: 16px 16px 8px; display: flex; align-items: center; gap: 12px; height: var(--header-h); }
.mark { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; background: var(--primary-main); color: #fff; font-weight: 800; font-size: 14px; }
.brand { font-weight: 700; font-size: 16px; }
.navScroll { flex: 1; overflow-y: auto; padding: 0 16px 16px; }
.navSub { padding: 16px 8px 8px 12px; font-size: 11px; font-weight: 700; line-height: 1.5; text-transform: uppercase; color: var(--text-disabled); }
.navList { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.navItem { display: flex; align-items: center; min-height: 44px; padding: 4px 8px 4px 12px; border-radius: var(--radius); color: var(--text-secondary); text-decoration: none; font-size: 14px; font-weight: 500; line-height: 22px; }
.navItem:hover { background: var(--action-hover); }
.navItem[aria-current="page"] { color: var(--nav-active-color); background: rgb(var(--primary-ch) / 0.08); font-weight: 600; }
.navIcon { width: 24px; height: 24px; margin-right: 12px; flex-shrink: 0; }
.content { display: flex; flex-direction: column; min-height: calc(100vh - 41px); padding-left: var(--nav-w); }
.header { position: sticky; top: 41px; z-index: 1101; display: flex; align-items: center; gap: 8px; height: var(--header-h); padding: 0 40px; background: rgb(var(--bg-default-ch) / 0.8); backdrop-filter: blur(8px); }
.iconBtn { display: inline-grid; place-items: center; width: 40px; height: 40px; padding: 0; border: 0; border-radius: 50%; background: transparent; color: var(--action-active); cursor: pointer; }
.iconBtn:hover { background: var(--action-hover); }
.menuButton { display: none; }
.headerActor { display: flex; align-items: center; gap: 8px; margin-left: auto; font-size: 14px; font-weight: 500; }
.avatar { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--soft-default-bg); font-size: 12px; font-weight: 700; }
.main { width: 100%; max-width: 1400px; margin: 0 auto; padding: 8px 40px 96px; }
.scrim { position: fixed; inset: 0; z-index: 1200; background: var(--backdrop); }

/* ===== Page.module.css ===== */
.pageHead { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; justify-content: flex-end; margin-bottom: 40px; }
.pageHeadText { flex: 1 1 auto; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.title { font-size: 24px; font-weight: 700; line-height: 1.5; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.subtitle { font-size: 18px; font-weight: 600; line-height: 1.5556; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; column-gap: 16px; row-gap: 4px; margin: 0; padding: 0; list-style: none; }
.crumbs li { display: inline-flex; align-items: center; gap: 16px; font-size: 14px; }
.crumbs li + li::before { content: ''; width: 4px; height: 4px; border-radius: 50%; background: var(--text-disabled); }
.crumbs a { color: var(--text-primary); text-decoration: none; }
.crumbs a:hover { text-decoration: underline; }
.crumbs [aria-current] { color: var(--text-disabled); }
.card { position: relative; background: var(--bg-paper); border-radius: var(--radius-card); box-shadow: var(--shadow-card); }
.cardPad { padding: 24px; }
.cardHead { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 24px 24px 0; }
.cardHead p { margin: 4px 0 0; }
.toolbar { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; padding: 20px; }
.tabs { display: flex; gap: 40px; margin-bottom: 24px; border-bottom: 1px solid var(--divider); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { position: relative; display: inline-flex; align-items: center; gap: 8px; min-width: 48px; min-height: 48px; padding: 0; border: 0; background: none; color: var(--text-secondary); font-size: 14px; font-weight: 500; line-height: 22px; white-space: nowrap; cursor: pointer; }
.tab:hover { color: var(--text-primary); }
.tab[aria-selected="true"] { color: var(--text-primary); font-weight: 600; }
.tab[aria-selected="true"]::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: currentColor; }

/* ===== Knoppen ===== */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 36px; padding: 6px 16px; border: 1px solid var(--button-outlined); border-radius: var(--radius); background: transparent; color: var(--text-primary); font-size: 14px; font-weight: 700; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { background: var(--action-hover); }
.btnPrimary { background: var(--primary-main); border-color: var(--primary-main); color: #fff; }
.btnPrimary:hover { background: var(--primary-dark); border-color: var(--primary-dark); }
.btnSm { min-height: 0; padding: 4px 12px; border-radius: var(--radius-sm); font-size: 0.8125rem; font-weight: 500; }
.btnRow { display: flex; flex-wrap: wrap; gap: 8px; }

/* ===== Badges (StatusBadge.module.css) ===== */
.badge { display: inline-flex; align-items: center; justify-content: center; height: 24px; min-width: 24px; padding: 0 6px; border-radius: var(--radius-label); font-size: 0.75rem; font-weight: 700; line-height: 1.5; white-space: nowrap; }
.ready { background: var(--status-ready-bg); color: var(--status-ready-text); }
.awaiting { background: var(--status-awaiting-bg); color: var(--status-awaiting-text); }
.planned { background: var(--status-planned-bg); color: var(--status-planned-text); }
.neutral { background: var(--status-neutral-bg); color: var(--status-neutral-text); }

/* ===== Kaarten (LegacyConfig.module.css) ===== */
.cardGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
.summaryCard { display: flex; flex-direction: column; gap: 4px; min-width: 0; padding: 16px; border: 1px solid var(--divider); border-top-width: 4px; border-radius: var(--radius-card); background: var(--bg-paper); box-shadow: var(--shadow-card); overflow-wrap: anywhere; }
.summaryCardOpen { outline: 2px solid var(--color-accent); }
.cardWarning { border-top-color: var(--color-warning); }
.cardSuccess { border-top-color: var(--color-success); }
.cardNeutral { border-top-color: var(--divider); }
.summaryTitle { font-size: 0.875rem; font-weight: 600; color: var(--text-secondary); }
.summaryCount { font-size: 2rem; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; }
.summaryTop { font-weight: 600; }
.summarySub { font-size: 0.8125rem; color: var(--text-secondary); }
.summaryButton { align-self: flex-start; margin-top: auto; padding: 4px 12px; border: 1px solid var(--color-border-dark); border-radius: var(--radius-sm); background: transparent; color: var(--text-primary); font-size: 0.8125rem; cursor: pointer; }
.summaryButton:hover { background: var(--action-hover); }
.summaryCard .summaryButton { margin-top: 8px; }
.detailPanel { margin-top: 16px; padding: 24px; border-radius: var(--radius-card); background: var(--bg-paper); box-shadow: var(--shadow-card); overflow-wrap: anywhere; }
.detailPanel h3 { font-size: 16px; font-weight: 600; margin-bottom: 8px; }

/* Paneelrijen */
.rowList { list-style: none; margin: 0; padding: 0; }
.rowList li { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 12px 0; border-bottom: 1px dashed var(--divider); }
.rowList li:last-child { border-bottom: 0; }
.rowMain { flex: 1 1 280px; min-width: 0; }
.rowMain strong { font-weight: 600; }
.rowMeta { color: var(--text-secondary); font-size: 0.8125rem; }
.code { font-weight: 700; font-variant-numeric: tabular-nums; }

/* ===== Intro / uitleg ===== */
.intro { margin-bottom: 24px; max-width: 760px; }
.intro p { color: var(--text-secondary); }
details.what { margin-top: 8px; }
details.what summary, details.tech summary { cursor: pointer; font-weight: 600; color: var(--soft-primary-text); width: fit-content; border-radius: 4px; }
details.what p { margin-top: 8px; }
.section { margin-top: 32px; }

/* ===== Formuliervelden ===== */
.field { height: 40px; padding: 0 12px; border: 1px solid var(--input-outlined); border-radius: var(--radius); background: transparent; color: var(--text-primary); font: inherit; }
.field:hover { border-color: var(--text-primary); }
select.field { padding-right: 8px; }
select.field option { background: var(--bg-paper); color: var(--text-primary); }
.search { flex: 1 1 240px; min-width: 200px; }
.fieldLabel { display: flex; align-items: center; gap: 8px; color: var(--text-secondary); font-size: 0.8125rem; font-weight: 600; }

/* ===== Tabel (DataTable.module.css) ===== */
.wrap { overflow-x: auto; }
.table { width: 100%; border-collapse: collapse; font-size: 0.875rem; font-variant-numeric: tabular-nums; }
.table th, .table td { padding: 14px 16px; border-bottom: 1px dashed var(--divider); text-align: left; vertical-align: middle; }
.table td { height: 52px; }
.table th { padding: 16px; background: var(--bg-neutral); font-weight: 600; color: var(--text-secondary); white-space: nowrap; }
.table th:first-child, .table td:first-child { padding-left: 20px; }
.table tbody tr:last-child td { border-bottom: 0; }
.empty { padding: 16px; color: var(--text-secondary); font-style: italic; }
.pager { display: flex; justify-content: flex-end; align-items: center; gap: 16px; padding: 12px 20px; border-top: 1px dashed var(--divider); color: var(--text-secondary); font-size: 0.8125rem; }
.pager button { border: 0; background: transparent; padding: 4px 8px; border-radius: var(--radius-sm); cursor: pointer; color: var(--text-primary); }
.pager button:disabled { color: var(--text-disabled); cursor: not-allowed; }
.cardClip { overflow: hidden; }

/* ===== Prodis FieldGroup ===== */
.fieldGroup { margin-top: 24px; }
.overline { font-size: 0.75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 12px; }
.dl { display: grid; grid-template-columns: minmax(140px, 220px) 1fr; gap: 12px 24px; margin: 0; }
.dl dt { color: var(--text-secondary); }
.dl dd { margin: 0; font-weight: 500; }
.dl .unset { font-style: italic; font-weight: 400; color: var(--text-disabled); }

/* ===== Banner e.d. ===== */
.banner { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; margin-top: 24px; padding: 16px 20px; border-radius: var(--radius); background: var(--alert-info-bg); color: var(--text-primary); }
.banner .bi { flex: none; width: 20px; height: 20px; color: var(--soft-primary-text); }
.banner p { flex: 1 1 280px; }
.mini { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
.taskList { list-style: none; margin: 8px 0 0; padding: 0; }
.taskList li { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding: 8px 0; border-top: 1px dashed var(--divider); font-size: 0.8125rem; }
.taskList .grow { flex: 1 1 auto; }
.linkCardTop { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.linkCardTop h3 { font-size: 16px; font-weight: 700; }
.versionRow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 12px 24px; border-top: 1px dashed var(--divider); }
.versionRow .vname { flex: 1 1 160px; font-weight: 600; }
.techBox { margin-top: 32px; padding: 16px 24px; border: 1px dashed var(--divider); border-radius: var(--radius-card); }
.techBox .dl { margin-top: 12px; }
.vdSection { margin-top: 24px; }
.vdSection > h4 { margin: 0 0 12px; font-size: 0.75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-secondary); }
.vdHead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.mapCard { padding: 16px; border: 1px solid var(--divider); border-radius: var(--radius-card); }
.mapCard h5 { margin: 0 0 8px; font-size: 14px; font-weight: 600; }
.legacyCol { color: var(--text-secondary); font-size: 0.8125rem; }
.chain { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 24px; padding: 0; list-style: none; counter-reset: st; }
.chain li { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px; border: 1px solid var(--divider); border-radius: var(--radius-label); color: var(--text-secondary); font-size: 0.8125rem; }
.chain li + li::before { content: '→'; margin-right: 0; color: var(--text-disabled); }
.chain li[aria-current="step"] { border-color: var(--primary-main); background: rgb(var(--primary-ch) / 0.08); color: var(--text-primary); font-weight: 700; }

/* ===== Importdefinities / naamgeving ===== */
.btn:disabled { color: var(--text-disabled); border-color: var(--divider); cursor: not-allowed; background: transparent; }
.btnPrimary:disabled { background: var(--action-selected); border-color: transparent; color: var(--text-disabled); }
.banner.warn { background: rgb(var(--warning-ch) / 0.16); }
.banner.warn .bi { color: var(--soft-warning-text); }
.linkRow { margin-top: 8px; font-size: 0.8125rem; }
.footnote { margin-top: 4px; font-size: 0.75rem; color: var(--text-disabled); }
.mockbar .toggle { padding: 4px 12px; border: 1px solid currentColor; border-radius: var(--radius-label); background: transparent; color: inherit; cursor: pointer; font-size: 13px; }
.mockbar .toggle[aria-pressed="true"], .mockbar .toggle[aria-expanded="true"] { background: var(--primary-main); color: #fff; font-weight: 600; }
.namePop { position: fixed; top: 44px; right: 16px; z-index: 1500; width: min(760px, calc(100vw - 32px)); max-height: calc(100vh - 64px); overflow: auto; padding: 20px 24px; border-radius: var(--radius-card); background: var(--bg-paper); color: var(--text-primary); box-shadow: var(--shadow-dialog); border: 1px solid var(--divider); }
.namePop h2 { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
.namePop h3 { font-size: 13px; font-weight: 700; margin: 16px 0 4px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-secondary); }
.namePop .table th, .namePop .table td { padding: 8px 12px; height: auto; }
.namePop .table th:first-child, .namePop .table td:first-child { padding-left: 12px; }
@media (max-width: 768px) { .namePop .table thead { position: static; width: auto; height: auto; clip: auto; } .namePop .table, .namePop .table tbody, .namePop .table tr, .namePop .table td { display: revert; width: auto; } .namePop .table tr { padding: 0; } .namePop .table td, .namePop .table th:first-child, .namePop .table td:first-child { padding: 8px 12px; } .namePop .table td[data-label]::before { content: none; } .mockbar { flex-wrap: wrap; } }

/* ===== Legenda ===== */
.legend { position: fixed; right: 16px; bottom: 16px; z-index: 1300; padding: 6px 12px; border-radius: var(--radius); background: var(--inherit-bg); color: var(--inherit-text); font-size: 12px; box-shadow: var(--shadow-z8); }

/* ===== Responsief ===== */
@media (max-width: 900px) {
  .sidebar { width: var(--nav-mobile-w); transform: translateX(-100%); }
  .sidebar.open { transform: none; }
  .content { padding-left: 0; }
  .header { padding: 0 16px; }
  .main { padding: 8px 16px 96px; }
  .menuButton { display: inline-grid; }
}
@media (max-width: 899px) { .tabs { gap: 24px; } }

      var p = $('#vdh'); if (p) { p.setAttribute('tabindex', '-1'); p.focus(); if (p.scrollIntoView) { p.scrollIntoView({ block: 'start' }); } }
    }
    document.querySelectorAll('[data-tview]').forEach(function (b) { b.addEventListener('click', function () { toFields(b.getAttribute('data-tview')); }); });
    document.querySelectorAll('[data-tfields]').forEach(function (b) { b.addEventListener('click', function () { toFields(b.getAttribute('data-tfields').split(':')[1]); }); });
    var sel = $('[data-vsel="template"]');
    if (sel) { sel.addEventListener('change', function () { tMapNum = sel.value; template(); $('#vsel').focus(); }); }
  }

  /* ---------- Naamgeving (voorstel) ---------- */
  var navNames = [
    ['Werkvoorraad', 'Inlezingen', 'Alle ingelezen leveranciersbestanden en wat er nog mee moet gebeuren.'],
    ['Levering uploaden', 'Bestand uploaden', 'Lees een bestand van een leverancier in en laat het controleren.'],
    ['Behandelgevallen', 'Afwijkingen', 'Dezelfde vaststelling uit meerdere bestanden, één keer te beoordelen.'],
    ['Publicatiebundels', 'Publicaties', 'Goedgekeurde wijzigingen samenstellen, bevriezen en naar Prodis publiceren.'],
    ['Overzicht (Inrichting)', 'Leveranciers', 'Welke leveranciers kunnen bestanden aanleveren en wat moet nog ingericht worden.'],
    ['Nieuwe leverancier', 'Leverancier toevoegen', 'Richt een nieuwe leverancier of aankoopvereniging in, stap voor stap.'],
    ['Sjablonen', 'Importdefinities', 'Alle importdefinities, eigen en herbruikbaar.'],
    ['Overname uit legacy', 'Overname uit legacy (blijft)', '']
  ];
  var wordNames = [['Batch', 'Inlezing'], ['Mutatie', 'Wijziging'], ['Bundel', 'Publicatie'], ['Behandelgeval', 'Afwijking'], ['Beschrijving van het bestand', 'Importdefinitie'], ['Sjabloon', 'Herbruikbare importdefinitie']];
  function namePop() {
    $('#namePop').innerHTML = '<h2>Naamgeving (voorstel)</h2><p class="rowMeta">Open voorstel; nog niet beslist.</p>' +
      '<h3>Navigatie</h3><div class="wrap"><table class="table"><thead><tr><th>Nu</th><th>Voorstel</th><th>Ondertitel</th></tr></thead><tbody>' +
      navNames.map(function (r) { return '<tr><td data-label="Nu">' + esc(r[0]) + '</td><td data-label="Voorstel"><strong>' + esc(r[1]) + '</strong></td><td data-label="Ondertitel">' + (r[2] ? esc(r[2]) : '<span class="rowMeta">—</span>') + '</td></tr>'; }).join('') + '</tbody></table></div>' +
      '<h3>Woordenlijst</h3><div class="wrap"><table class="table"><thead><tr><th>Nu</th><th>Voorstel</th></tr></thead><tbody>' +
      wordNames.map(function (r) { return '<tr><td data-label="Nu">' + esc(r[0]) + '</td><td data-label="Voorstel"><strong>' + esc(r[1]) + '</strong></td></tr>'; }).join('') + '</tbody></table></div>';
  }
  function setNamePop(open) {
    $('#namePop').hidden = !open; $('#nameBtn').setAttribute('aria-expanded', open);
  }
  namePop();
  $('#nameBtn').addEventListener('click', function () { setNamePop($('#namePop').hidden); });

  /* ---------- Router + chrome ---------- */
  var ROUTE_RE = /^#(dashboard|supplier|templates|template(?:\/[^\/]+)?)$/;
  var currentRoute = location.hash || '#dashboard';
  function route() {
    var h = currentRoute, tm = /^#template(?:\/([^\/]+))?$/.exec(h);
    var r = h === '#supplier' ? 'supplier' : h === '#templates' ? 'templates' : tm ? 'template' : 'dashboard';
    document.querySelectorAll('.seg button').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-route') === r); });
    var onTpl = r === 'templates' || r === 'template';
    if (onTpl) { $('#navTemplates').setAttribute('aria-current', 'page'); $('#navOverview').removeAttribute('aria-current'); }
    else { $('#navOverview').setAttribute('aria-current', 'page'); $('#navTemplates').removeAttribute('aria-current'); }
    closeMenu();
    if (r === 'supplier') { tab = 'overzicht'; mapVer = '3'; supplier(); }
    else if (r === 'templates') { templates(); }
    else if (r === 'template') { var tc = tm[1] ? decodeURIComponent(tm[1]) : 'VRM-SJ'; curTpl = tplData[tc] ? tc : 'VRM-SJ'; ttab = 'overzicht'; tMapNum = null; template(); }
    else { dashboard(); }
    window.scrollTo(0, 0);
  }
  function go(href) {
    currentRoute = href;
    try { history.pushState(null, '', href); } catch (err) { /* ignore: fragment navigation not available */ }
    route();
    try { window.scrollTo(0, 0); } catch (err) { /* ignore */ }
  }
  document.addEventListener('click', function (e) {
    var a = e.target && e.target.closest ? e.target.closest('a[href^="#"]') : null;
    if (!a || a.hasAttribute('data-nolink')) return;
    var href = a.getAttribute('href');
    if (!ROUTE_RE.test(href)) return;
    e.preventDefault();
    go(href);
  }, true);
  document.querySelectorAll('.seg button').forEach(function (b) { b.addEventListener('click', function () { var d = b.getAttribute('data-route'); go('#' + d + (d === 'template' ? '/VRM-SJ' : '')); }); });
  document.querySelectorAll('[data-nolink]').forEach(function (a) { a.addEventListener('click', function (e) { e.preventDefault(); }); });
  window.addEventListener('hashchange', function () { currentRoute = location.hash || '#dashboard'; route(); });
  window.addEventListener('popstate', function () { currentRoute = location.hash || '#dashboard'; route(); });

  function closeMenu() { $('#sidebar').classList.remove('open'); $('#scrim').hidden = true; $('#menuBtn').setAttribute('aria-expanded', 'false'); }
  $('#menuBtn').addEventListener('click', function () { var o = !$('#sidebar').classList.contains('open'); $('#sidebar').classList.toggle('open', o); $('#scrim').hidden = !o; this.setAttribute('aria-expanded', o); });
  $('#scrim').addEventListener('click', closeMenu);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closeMenu(); if (!$('#namePop').hidden) { setNamePop(false); $('#nameBtn').focus(); } } });

  $('#themeBtn').addEventListener('click', function () {
    var cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
  });

  route();
})();
</script>
</body>
</html>
