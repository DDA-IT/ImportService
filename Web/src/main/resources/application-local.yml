spring:
  datasource:
    url: jdbc:h2:mem:catalogimport;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
catalogimport:
  archive:
    # Lokale ontwikkelmap; productie zet catalogimport.archive.root expliciet (geen default in application.yml).
    root: ${java.io.tmpdir}/catalogimport-archive
