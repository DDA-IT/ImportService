spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/catalog_import
    username: catalog_import
    password: catalog_import
    driver-class-name: org.postgresql.Driver
  # Lokaal draait de Prodis-Keycloak (:9080, realm prodis) met dezelfde client als Prodis: web_app,
  # met het vaste dev-secret uit de Prodis realm-export. Overschrijfbaar via de omgeving (zie docs/decisions.md 2026-10-20).
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${CATALOG_OIDC_CLIENT_ID:web_app}
            client-secret: ${CATALOG_OIDC_CLIENT_SECRET:web_app}
        provider:
          keycloak:
            issuer-uri: ${CATALOG_OIDC_ISSUER_URI:http://localhost:9080/realms/prodis}
catalogimport:
  archive:
    # Lokale ontwikkelmap; productie zet catalogimport.archive.root expliciet (geen default in application.yml).
    root: C:/tmp/catalogimport-archive
  local-source:
    # Tweede ontvangstweg (docs/decisions.md 2026-09-27): de map waarin een mens een leveringsbestand zet,
    # waarna het via de API ingelezen kan worden. De map MOET bestaan voor de applicatie opstart - is ze er
    # niet, dan stopt het opstarten met een IllegalStateException (D3). Maak ze dus één keer aan:
    #   mkdir C:\tmp\catalogimport-local-source
    # Wil je deze ontvangstweg lokaal niet, zet dan deze regel in commentaar (afwezig = feature uit).
    # Let op: dit geldt ook voor de tests van de Web-module, die het profiel local gebruiken.
    directory: C:/tmp/catalogimport-local-source
  # Fase 5-PERM (docs/design/fase5-perm-design.md par. 2): rechten per gebruiker, fail-closed.
  # Er is GEEN wildcard en GEEN default, in geen enkel profiel: zonder een regel hieronder heeft
  # niemand ook maar één recht en geeft elk beschermd endpoint 403 PERMISSION_DENIED.
  #
  # >>> VUL HIER JE EIGEN KEYCLOAK-USERNAME IN (claim preferred_username, zichtbaar via
  # >>> GET /api/catalog-import/me). De placeholder hieronder komt met niemand overeen.
  #
  # Matching is getrimd en hoofdletterongevoelig. Toegelaten rechten: read, manage, approve
  # (of hun volledige codes catalogImport.read/.manage/.approve). De hiërarchie doet de rest:
  # approve impliceert manage en read, manage impliceert read.
  # 'system' mag hier hoogstens read krijgen; met manage of approve start de applicatie niet.
  # Rechtenbron: CONFIGURED = de grants hieronder (lokaal zonder Prodis). Wil je lokaal de rechten uit Prodis (backend :8080
  # moet draaien, de gebruiker moet er een rol met catalogImport.* hebben), zet dan in je omgeving:
  #   CATALOG_PERMISSION_SOURCE=PRODIS
  #   CATALOG_PRODIS_ACCOUNT_URL=http://localhost:8080/api/account   (default hieronder; ook voor de productwisselaar)
  # Onder PRODIS worden de grants genegeerd. Productie (application.yml) staat default op PRODIS.
  permissions:
    source: ${CATALOG_PERMISSION_SOURCE:CONFIGURED}
    prodis:
      account-url: ${CATALOG_PRODIS_ACCOUNT_URL:http://localhost:8080/api/account}
    grants:
      - username: Dda
        rights: read, manage, approve
  # Productwisselaar (docs/decisions.md 2026-10-20): lokaal de Prodis-frontend (:9060) als link en de Prodis-backend
  # (:8080) voor de token relay naar GET /api/account (ProFin/ProDev in de wisselaar). Leeg = geen link / geen relay;
  # ongeldige URL = de applicatie start niet. Prodis niet gestart = enkel de Prodis-link (fail-soft, WARN-log).
  app-switcher:
    prodis-url: ${CATALOG_PRODIS_URL:http://localhost:9060}
    prodis-account-url: ${CATALOG_PRODIS_ACCOUNT_URL:http://localhost:8080/api/account}
  # Legacy-config-push (docs/decisions.md 2026-10-20 M2): lokaal de Prodis-Keycloak (realm prodis) met audience web_app
  # (design par. 3: lokale audience web_app) en de confidential client prodis-datasync-catalogimport (in prodis-realm.json
  # van de Prodis-repo aan te maken, met client role legacy-config-push op web_app). Overschrijfbaar via de omgeving.
  technical-clients:
    legacy-config:
      audience: ${CATALOG_LEGACY_PUSH_AUDIENCE:web_app}
      client-id: ${CATALOG_LEGACY_PUSH_CLIENT_ID:prodis-datasync-catalogimport}
  # Alleen-lezen Prodis-database (legacy-config S5): lokaal BEWUST NIET ingevuld. De lokale Docker-database
  # (prodis-postgresql-1, database Prodis) heeft enkel de eigenaar/superuser Prodis; die met haar wachtwoord hier zetten
  # zou een schrijvende sleutel in de repo leggen. Zonder waarden staat de functie uit (gedrag S2). Lokaal aanzetten via
  # de omgeving, bij voorkeur met een eigen alleen-lezen rol (zie de GRANTs in legacy-config-bundle-design.md par. 6):
  #   CATALOG_PRODIS_DB_URL=jdbc:postgresql://localhost:5432/Prodis
  #   CATALOG_PRODIS_DB_USERNAME=catalogimport_ro
  #   CATALOG_PRODIS_DB_PASSWORD=...
  # Let op: de Web-tests gebruiken dit profiel; de S2-tests zetten de functie expliciet uit.
server:
  # Stel bijvoorbeeld CATALOG_SERVER_PORT=8083 in zonder de YAML te wijzigen.
  port: ${CATALOG_SERVER_PORT:8081}
  servlet:
    session:
      cookie:
        # Lokaal over http: een secure-cookie zou de browser nooit terugsturen.
        secure: false
