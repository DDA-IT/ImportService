spring:
  application:
    name: catalog-import
  datasource:
    url: ${CATALOG_DB_URL:jdbc:postgresql://localhost:5432/catalog_import}
    username: ${CATALOG_DB_USERNAME:catalog_import}
    # Bewust GEEN default (docs/decisions.md 2026-10-02, S7-b): zet CATALOG_DB_PASSWORD. Niet gezet = de applicatie
    # start niet (DatasourcePasswordCheck, voor de DataSource/Liquibase). Leeg (CATALOG_DB_PASSWORD=) mag expliciet.
    # De profielen local/demo/ewoutdev zetten hun eigen lokale waarde.
    password: ${CATALOG_DB_PASSWORD}
    hikari:
      data-source-properties:
        # pgjdbc-property (geldt voor alle profielen, de URL blijft ongewijzigd): zonder dit bevat een
        # constraint-fout de hele rij ("Failing row contains ..."), dus ook de ciphertext van een credential
        # (docs/decisions.md 2026-09-29, K-2a (a); credentials-sleutelbeheer-design par. 2.5).
        logServerErrorDetail: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  servlet:
    multipart:
      # Een catalogus van een miljoen regels is honderden MB's groot; Spring's standaard van 1 MB
      # zou zo'n upload weigeren nog voor de service iets ziet. Per omgeving te verlagen.
      max-file-size: ${CATALOG_MAX_UPLOAD_SIZE:1GB}
      max-request-size: ${CATALOG_MAX_UPLOAD_SIZE:1GB}
  # Fase 5-AUTH (docs/design/fase5-auth-design.md par. 2.3): login via Keycloak (BFF, sessiecookie).
  # Client-id, secret en issuer komen altijd uit de omgeving; het secret heeft nergens een default en hoort
  # nooit in de repo. SecurityConfiguration weigert op te starten zonder bruikbaar secret.
  security:
    oauth2:
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: ${CATALOG_OIDC_CLIENT_ID}
            client-secret: ${CATALOG_OIDC_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            scope: openid, profile, email
        provider:
          keycloak:
            issuer-uri: ${CATALOG_OIDC_ISSUER_URI}
            user-name-attribute: preferred_username
# catalogimport.archive.root (bronarchief van leveringen) is verplicht en heeft bewust geen default:
# zet het per omgeving (application-local.yml voor lokaal gebruik).
#
# catalogimport.local-source.directory staat hier BEWUST NIET (tweede ontvangstweg, docs/decisions.md
# 2026-09-27 D1/D2/D3): de beheerde servermap waaruit een levering ingelezen kan worden. Optioneel, geen
# default. Niet gezet = die ontvangstweg bestaat niet en beide endpoints (GET /local-source/files,
# POST /tasks/{id}/deliveries/local-source) geven 404 LOCAL_SOURCE_NOT_CONFIGURED. Is ze wél gezet, dan
# moet het pad bij het opstarten bestaan, een map zijn, leesbaar zijn en niet overlappen met
# catalogimport.archive.root - anders start de applicatie niet (een stil niet-werkende ontvangstweg zou
# pas bij de eerste levering opvallen). Het OS-account van de applicatie heeft er enkel LEESRECHT nodig:
# CatalogImport verplaatst of verwijdert er nooit iets; opruimen is een operatortaak.
#
# catalogimport.setup-api.enabled staat hier BEWUST NIET. Sinds NT-3 (docs/decisions.md 2026-09-30,
# NT-spoor V2 = a) schermt de vlag enkel nog GET /api/catalog-import/setup/overview en het sjabloonbeheer
# (POST /templates/{id}/revisions/{r}/bookmarks en .../bookmarks/{name}/usages) af: zonder vlag bestaan die
# niet (404; 405 voor POST .../bookmarks, omdat GET op dat pad altijd bestaat). De schrijfpaden van de inrichting (/setup/**), sjablonen lezen/materialiseren en de bookmarkwaarden
# van een koppeling bestaan altijd en zijn enkel beschermd door een login en het recht catalogImport.manage
# (schrijven) of catalogImport.read (lezen). Alleen het demo-profiel zet de vlag aan.
#
# catalogimport.permissions.grants staat hier BEWUST NIET (Fase 5-PERM, docs/design/fase5-perm-design.md
# par. 2): geen wildcard en geen default, in geen enkel profiel. Zonder expliciete toekenning heeft
# niemand ook maar een enkel recht (fail-closed) en geeft elk beschermd endpoint 403 PERMISSION_DENIED.
# Zie application-local.yml / application-demo.yml voor de vorm van een toekenning.
catalogimport:
  # Sleutelring voor de versleutelde opslag van externe credentials (docs/decisions.md 2026-09-29, K-1;
  # docs/design/credentials-sleutelbeheer-design.md). BEWUST GEEN sleutel en geen default in geen enkel profiel.
  # Niet gezet (beide leeg) = functie uit: de app start, opslaan/ontsleutelen geeft SECRETS_NOT_CONFIGURED.
  # Wel gezet maar ongeldig (geen base64, niet 32 bytes, dubbele id, actieve id ontbreekt, zelfde materiaal
  # onder twee id's, keys zonder actieve id of omgekeerd) = de applicatie start niet.
  # Zet per omgeving:  CATALOG_SECRETS_KEYS=<id1>:<base64>,<id2>:<base64>   (id = [A-Za-z0-9-]{1,32})
  #                    CATALOG_SECRETS_ACTIVE_KEY_ID=<id1>
  # Genereer een sleutel met:  openssl rand -base64 32
  secrets:
    keys: ${CATALOG_SECRETS_KEYS:}
    active-key-id: ${CATALOG_SECRETS_ACTIVE_KEY_ID:}
  # catalogimport.fetch.* staat hier BEWUST NIET als waarde (K-4a; docs/decisions.md 2026-09-29 L4b, A12;
  # docs/design/leveringsconfiguratie-design.md par. 5 en 8). Enkel deze toelichting:
  #   fetch.allowed-hosts   (env CATALOGIMPORT_FETCH_ALLOWED_HOSTS) exacte hostnamen, komma-gescheiden in EEN string,
  #                         beheerd door infra; geen wildcards. Niet gezet = hostsleutelscan, verbindingstest en ophalen
  #                         bestaan niet (404 FETCH_NOT_CONFIGURED). Ongeldige ingang = de applicatie start niet.
  #                         Een YAML-lijst wordt niet gelezen (de functie blijft dan uit).
  #   fetch.allow-loopback  default false. Laat 127.0.0.0/8 en ::1 toe - ENKEL voor ontwikkeling en tests (embedded
  #                         SFTP-server). Link-local, multicast en 0.0.0.0/:: blijven altijd geweigerd.
  #   fetch.connect-timeout default PT15S (TCP + sleuteluitwisseling), fetch.auth-timeout default PT15S,
  #   fetch.idle-timeout    default PT60S, fetch.listing-cap default 10000 (meer ingangen = FETCH_LISTING_TOO_LARGE).
  #   fetch.stuck-after     default PT60M (K-4c, zoals publication-run.stuck-after): een ophaalrun die RUNNING blijft zonder
  #                         levering (procescrash) is daarna "vastgelopen". Een ongeldige of niet-positieve waarde laat de
  #                         applicatie niet opstarten. Het afbreek-endpoint (POST /task-runs/{id}/abort, MANAGE) kent
  #                         GEEN tijdsvoorwaarde. fetch.recovery-on-startup default true: bij het opstarten worden
  #                         vastgelopen runs FAILED/FETCH_TIMED_OUT (veronderstelt één instantie; tests zetten dit uit).
  screening:
    # Aantal rijen per microbatch-transactie tijdens het stagen (design par. 2 en par. 9 stap C).
    stage-batch-size: 2000
    # Aantal gestagede regels per chunk-transactie tijdens de delta en de mutatiegeneratie
    # (design par. 9 stap E). Elke chunk legt ook het hervatpunt vast.
    mutation-chunk-size: 5000
    # Aantal gestagede regels per chunk-transactie tijdens de prijsafwijkingscontrole (ontwerp fase 3,
    # par. 3.1 stap E3). Eigen grens naast mutation-chunk-size: die pass leest per chunk ook de
    # prijshistoriek en heeft haar eigen hervatpunt (price_progress_row_number).
    price-control-chunk-size: 5000
    # Aantal bewaarde voorbeeldrijen per foutcode (ontwerp fase 3, R-ISS-03). Boven dit aantal worden er
    # geen extra voorbeelden bewaard, maar blijven de volledige aantallen per code behouden in één
    # ROW_ISSUE_RECORDING_CAPPED-melding. De levering blokkeert hier NIET door: dit is een logginggrens,
    # geen businessoordeel (vervangt de fase 2-grens max-recorded-row-issues / TOO_MANY_ROW_ISSUES).
    max-sample-rows-per-code: 200
    # Maximale lengte van een datalijn in tekens; langere regels worden verworpen, niet afgekapt.
    max-line-length: 100000
    # Bij het opstarten: een batch die op SCREENING bleef staan wordt FAILED (SCREENING_INTERRUPTED); een batch
    # op MUTATING blijft hervatbaar via POST /api/catalog-import/batches/{id}/continue. Sinds stap 4 claim-bewust:
    # enkel batches met een dode verwerkingsclaim worden aangeraakt; een levende claim van een andere instantie
    # blijft ongemoeid.
    recovery-on-startup: true
    # Verwerkingsclaim per batch (stap 4, docs/decisions.md 2026-10-01): een screening/hervatting houdt een claim
    # met heartbeat; een claim waarvan de heartbeat ouder is dan deze lease geldt als dood en mag overgenomen
    # worden. ISO-8601-duur; een ongeldige of niet-positieve waarde laat de applicatie niet opstarten.
    claim-lease: PT60M
  # catalogimport.instance-id staat hier BEWUST NIET als waarde: default is de hostnaam. Moet uniek zijn per
  # draaiende instantie (stap 4, verwerkingsclaim: eigenaar = <instance-id>/<bootId>). Geen '/', hoogstens 63
  # tekens; anders start de applicatie niet. Zet per omgeving bv. CATALOGIMPORT_INSTANCEID (Spring-relaxed binding) wanneer twee instanties
  # dezelfde hostnaam kunnen hebben (containers).
  trial-read:
    # Proefinlezing POST /api/catalog-import/revisions/{id}/trial-reads (NT-9, docs/design/proefinlezing-design.md
    # par. 3). Er wordt niets bewaard; de bestandsgrootte is begrensd door de bestaande multipartlimiet en de
    # regellengte door screening.max-line-length hierboven.
    # Aantal voorbeeldrijen (de eerste datarecords, ongeacht hun lot); 0 of negatief = default 20.
    sample-rows: 20
    # Aantal voorbeelden per issuegroep in het antwoord; het aantal voorvallen blijft altijd het werkelijke aantal.
    max-issue-examples-per-code: 5
    # Hoeveel aanbiedingsidentiteiten hoogstens in het geheugen gevolgd worden voor de controle op dubbele
    # identiteiten (grofweg 100 bytes per identiteit). Wordt de grens bereikt, dan is duplicateIdentityCount null
    # en staat de controle als TRACKING_LIMIT_REACHED in notEvaluated - nooit een stille 0.
    max-tracked-identities: 2000000
  publication-run:
    # Herstel van een vastgelopen PREPARING-publicatierun (docs/decisions.md 2026-09-27): een run die
    # tussen aanmaken en afronden door een proces- of serverfout blijft staan, blokkeert anders voorgoed
    # elke volgende run op die bundel (hoogstens één actieve run per bundel). Deze drempel bepaalt vanaf
    # wanneer PublicationRunService.requestRun zo'n vastgelopen run zelf automatisch als FAILED/
    # FAILURE_TIMED_OUT afsluit (geen scheduler: de controle gebeurt enkel bij de eerstvolgende aanvraag).
    # Het expliciete afbreek-endpoint (POST .../abort, recht APPROVE) kent GEEN tijdsvoorwaarde en is dus
    # niet aan deze drempel gebonden.
    stuck-after: PT60M
  staging-retention:
    # Opruiming van de kandidaatstaging (stap 7, docs/decisions.md 2026-10-02 "Stap 7 uitgewerkt"; zie de handleiding
    # par. 9.10). Verwijdert ENKEL import_candidate_stage/_price/_reference van BASELINE_ACCEPTED-batches die langer dan
    # "after" geleden aanvaard zijn en die de opruimguard toelaat; zet daarna import_batch.staging_purged_at.
    # Row-issues, mutaties, bronstaat, prijsobservaties, snapshots, issuegroepen, batch- en leveringsrijen en tellers
    # blijven ALTIJD. SCREENED, BLOCKED en FAILED worden niet opgeruimd.
    # Standaard UIT: zet per omgeving CATALOGIMPORT_STAGINGRETENTION_ENABLED=true. Uit = geen geplande taak en geen
    # scheduler.
    enabled: false
    # Wanneer de taak draait (Spring-cron met seconden, tijdzone van de JVM). Default dagelijks 03:30.
    cron: "0 30 3 * * *"
    # Retentie na de aanvaarding (ISO-8601-duur). Een ongeldige of niet-positieve waarde laat de applicatie niet opstarten.
    after: P7D
    # Aantal stagerijen per chunk-transactie (met hun prijzen en referenties). Ongeldig of <= 0 stopt de opstart.
    chunk-size: 10000
server:
  error:
    include-message: never
  servlet:
    session:
      # Sessie-idle-timeout = hoe lang ingetrokken toegang nog doorwerkt tot 5-PERM (beslissing V2 = B1).
      timeout: ${CATALOG_SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        # lax, niet strict: de Keycloak-callback is een top-level GET en moet de sessiecookie meedragen.
        same-site: lax
        secure: ${CATALOG_SESSION_COOKIE_SECURE:true}
# Actuator (docs/decisions.md 2026-10-02, stap 7, S7-c; Spring Boot 3.4-eigenschappen): ENKEL health (+ de probes
# liveness/readiness), zelfde poort, zonder details of componenten (anoniem bereikbaar via SecurityConfiguration, dus
# nooit infrastructuurdetails prijsgeven). Elk ander endpoint is uitgeschakeld (access.default none), ook al zou het
# ooit blootgesteld worden. /actuator/info bestaat niet meer.
management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          # Geen Keycloak- of SFTP-indicator: een extern systeem dat even weg is mag de instantie niet uit de rotatie halen.
          include: readinessState,db
  health:
    diskspace:
      # Moet bij de deploy bestaan: anders meldt diskSpace DOWN (en dus ook /actuator/health). Het pad komt uit het
      # verplichte catalogimport.archive.root (geen default in dit bestand; zonder start de applicatie sowieso niet).
      path: ${catalogimport.archive.root}
      threshold: ${CATALOG_DISK_THRESHOLD:2GB}
