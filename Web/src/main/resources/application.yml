spring:
  application:
    name: catalog-import
  datasource:
    url: ${CATALOG_DB_URL:jdbc:postgresql://localhost:5432/catalog_import}
    username: ${CATALOG_DB_USERNAME:catalog_import}
    password: ${CATALOG_DB_PASSWORD:catalog_import}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  servlet:
    multipart:
      # Een catalogus van een miljoen regels is honderden MB's groot; Spring's standaard van 1 MB
      # zou zo'n upload weigeren nog voor de service iets ziet. Per omgeving te verlagen.
      max-file-size: ${CATALOG_MAX_UPLOAD_SIZE:1GB}
      max-request-size: ${CATALOG_MAX_UPLOAD_SIZE:1GB}
  # Fase 5-AUTH (docs/design/fase5-auth-design.md par. 2.3): login via Keycloak (BFF, sessiecookie).
  # Client-id, secret en issuer komen altijd uit de omgeving; het secret heeft nergens een default en hoort
  # nooit in de repo. SecurityConfiguration weigert op te starten zonder bruikbaar secret.
  security:
    oauth2:
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: ${CATALOG_OIDC_CLIENT_ID}
            client-secret: ${CATALOG_OIDC_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            scope: openid, profile, email
        provider:
          keycloak:
            issuer-uri: ${CATALOG_OIDC_ISSUER_URI}
            user-name-attribute: preferred_username
# catalogimport.archive.root (bronarchief van leveringen) is verplicht en heeft bewust geen default:
# zet het per omgeving (application-local.yml voor lokaal gebruik).
#
# catalogimport.setup-api.enabled staat hier BEWUST NIET: zonder die vlag bestaat de setup-API
# (/api/catalog-import/setup/**) niet en antwoordt elk setup-pad met 404. Die API kan importdefinities
# en hun drempels bepalen; ze vereist sinds 5-AUTH een login, maar kent nog geen rechten per actie
# (5-PERM). Alleen het demo-profiel zet ze aan.
catalogimport:
  screening:
    # Aantal rijen per microbatch-transactie tijdens het stagen (design par. 2 en par. 9 stap C).
    stage-batch-size: 2000
    # Aantal gestagede regels per chunk-transactie tijdens de delta en de mutatiegeneratie
    # (design par. 9 stap E). Elke chunk legt ook het hervatpunt vast.
    mutation-chunk-size: 5000
    # Aantal gestagede regels per chunk-transactie tijdens de prijsafwijkingscontrole (ontwerp fase 3,
    # par. 3.1 stap E3). Eigen grens naast mutation-chunk-size: die pass leest per chunk ook de
    # prijshistoriek en heeft haar eigen hervatpunt (price_progress_row_number).
    price-control-chunk-size: 5000
    # Aantal bewaarde voorbeeldrijen per foutcode (ontwerp fase 3, R-ISS-03). Boven dit aantal worden er
    # geen extra voorbeelden bewaard, maar blijven de volledige aantallen per code behouden in één
    # ROW_ISSUE_RECORDING_CAPPED-melding. De levering blokkeert hier NIET door: dit is een logginggrens,
    # geen businessoordeel (vervangt de fase 2-grens max-recorded-row-issues / TOO_MANY_ROW_ISSUES).
    max-sample-rows-per-code: 200
    # Maximale lengte van een datalijn in tekens; langere regels worden verworpen, niet afgekapt.
    max-line-length: 100000
    # Bij het opstarten: een batch die op SCREENING bleef staan wordt FAILED (SCREENING_INTERRUPTED); een batch
    # op MUTATING blijft hervatbaar via POST /api/catalog-import/batches/{id}/continue. Veronderstelt precies
    # één applicatie-instantie (geen lease/heartbeat tot Fase 5).
    recovery-on-startup: true
server:
  error:
    include-message: never
  servlet:
    session:
      # Sessie-idle-timeout = hoe lang ingetrokken toegang nog doorwerkt tot 5-PERM (beslissing V2 = B1).
      timeout: ${CATALOG_SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        # lax, niet strict: de Keycloak-callback is een top-level GET en moet de sessiecookie meedragen.
        same-site: lax
        secure: ${CATALOG_SESSION_COOKIE_SECURE:true}
management:
  endpoints:
    web:
      exposure:
        include: health,info
